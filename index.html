<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vachana Petti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+Malayalam:wght@400;500;700&display=swap">
<style>
/* Layout: one centred stage — a teak box holding a single verse slip that flips; controls beneath. */
:root{
  --night:#151a2b;
  --night-2:#1e2540;
  --teak:#6b3a1f;
  --teak-dark:#3f200f;
  --brass:#d9a441;
  --paper:#f6ecd4;
  --ink:#2a1e14;
  --muted:#b9b3c9;
  --display:"Marcellus", "Palatino Linotype", Georgia, serif;
  --mal:"Noto Serif Malayalam", "Kartika", "Nirmala UI", "Manjari", serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night) 60%);
  background-color:var(--night);
  color:var(--paper);font-family:var(--mal);
  padding-inline:16px;
}
.wrap{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-block:32px}
header{text-align:center;display:grid;gap:4px}
.mal-title{font-weight:700;font-size:clamp(30px,8vw,42px);color:var(--brass);line-height:1.35;margin:0}
.latin{font-family:var(--display);font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}

.box{
  position:relative;width:100%;max-width:440px;
  background:linear-gradient(180deg,#7a4524,var(--teak) 40%,var(--teak-dark));
  border-radius:10px;padding:22px 18px 26px;
  box-shadow:0 30px 60px -20px #000c, inset 0 2px 0 #ffffff1f, inset 0 -6px 0 #0000004d;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  border:none;color:inherit;font:inherit;text-align:inherit;display:block;
}
.box:focus-visible{outline:3px solid var(--brass);outline-offset:4px}
.box::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.18;
  background:repeating-linear-gradient(100deg,transparent 0 9px,#000 9px 10px,transparent 10px 23px,#fff3 23px 24px);
}
.plate{position:relative;margin:0 auto 16px;width:max-content;padding:3px 16px;border-radius:3px;
  background:linear-gradient(180deg,#f0c766,var(--brass) 55%,#a3762a);color:var(--teak-dark);
  font-size:13px;font-weight:700;box-shadow:0 1px 0 #0006}
.slot{position:relative;perspective:900px;min-height:250px;display:grid}
.slip{
  position:relative;background:var(--paper);color:var(--ink);border-radius:3px;
  padding:24px 22px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;
  box-shadow:0 6px 14px -6px #000a;transform-origin:50% 0;
  background-image:repeating-linear-gradient(0deg,transparent 0 29px,#c9b48a33 29px 30px);
}
.slip.flip{animation:flip .16s ease-in-out}
.slip.slow{animation:flip .38s ease-in-out}
.slip.land{animation:land .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(-88deg);filter:brightness(.7)}100%{transform:rotateX(0)}}
@keyframes land{0%{transform:scale(.96) rotate(-1deg)}100%{transform:none}}
.verse{font-size:clamp(16px,4.2vw,18.5px);line-height:1.85;margin:0}
.ref{font-weight:700;font-size:15px;color:var(--teak);margin:0;text-align:right}
.rolling .verse{filter:blur(1.2px);opacity:.75}
.hint{text-align:center;font-size:18px;font-weight:700;color:var(--teak);line-height:1.6}
.hint small{display:block;font-weight:400;font-size:14.5px;color:#7b6a55;margin-top:8px;line-height:1.7}

.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--mal);font-weight:500;font-size:16px;border-radius:999px;padding:11px 26px;cursor:pointer;border:1px solid var(--brass);transition:transform .15s, background .15s}
.btn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--brass);color:var(--teak-dark)}
.btn.primary:hover:not(:disabled){background:#e8b553}
.btn.ghost{background:transparent;color:var(--brass)}
.btn.ghost:hover{background:#d9a4411a}
.btn:active{transform:scale(.97)}
.status{font-size:14.5px;color:var(--muted);min-height:1.6em;text-align:center;margin:0}
footer{font-size:12.5px;color:#8a85a0;text-align:center}
@media (prefers-reduced-motion:reduce){.slip.flip,.slip.slow,.slip.land{animation:none}}
</style>

<style>body{margin:0}*,*::before,*::after{box-sizing:border-box}</style>
</head>
<body>
<div class="wrap" lang="ml">
  <header>
    <h1 class="mal-title">വചനപ്പെട്ടി</h1>
    <div class="latin" lang="en">Vachana Petti</div>
  </header>

  <button class="box" id="box" aria-label="വചനപ്പെട്ടി — തുടങ്ങാൻ തൊടുക, നിർത്താൻ വീണ്ടും തൊടുക">
    <div class="plate">ദൈവവചനം</div>
    <div class="slot">
      <div class="slip" id="slip" aria-live="polite">
        <div class="hint">പ്രാർത്ഥിച്ചിട്ട് പെട്ടിയിൽ തൊടുക<small>വചനങ്ങൾ മറിഞ്ഞുകൊണ്ടിരിക്കും. വീണ്ടും തൊടുമ്പോൾ നിങ്ങൾക്കുള്ള വചനം ലഭിക്കും.</small></div>
      </div>
    </div>
  </button>

  <p class="status" id="status">തുടങ്ങാൻ പെട്ടിയിൽ തൊടുക</p>

  <div class="controls">
    <button class="btn primary" id="main">തുടങ്ങുക</button>
    <button class="btn ghost" id="copy" hidden>പകർത്തുക</button>
  </div>

  <footer>സത്യവേദപുസ്തകം</footer>
</div>

<script>
const VERSES = [
  ["ജറെമിയാ 29:11","ഞാൻ നിങ്ങളെക്കുറിച്ചു നിരൂപിക്കുന്ന നിരൂപണങ്ങളെ ഞാൻ അറിയുന്നു എന്നു യഹോവയുടെ അരുളപ്പാടു; നിങ്ങൾക്കു ഒരു ശുഭഭാവിയും പ്രത്യാശയും നല്കുവാനുള്ളതായി തിന്മെക്കല്ല നന്മെക്കുള്ള നിരൂപണങ്ങൾ തന്നേ."],
  ["ഏശയ്യാ 41:10","നീ ഭയപ്പെടേണ്ടാ, ഞാൻ നിന്നോടുകൂടെ ഉണ്ടു; ഭ്രമിച്ചുനോക്കേണ്ടാ, ഞാൻ നിന്റെ ദൈവം ആകുന്നു; ഞാൻ നിന്നെ ശക്തീകരിക്കും; ഞാൻ നിന്നെ സഹായിക്കും; എന്റെ നീതിയുള്ള വലങ്കൈകൊണ്ടു ഞാൻ നിന്നെ താങ്ങും."],
  ["ഫിലിപ്പി 4:13","എന്നെ ശക്തനാക്കുന്നവൻ മുഖാന്തരം ഞാൻ സകലത്തിന്നും മതിയാകുന്നു."],
  ["സങ്കീർത്തനങ്ങൾ 23:1","യഹോവ എന്റെ ഇടയനാകുന്നു; എനിക്കു മുട്ടുണ്ടാകയില്ല."],
  ["സുഭാഷിതങ്ങൾ 3:5-6","പൂർണ്ണഹൃദയത്തോടെ യഹോവയിൽ ആശ്രയിക്ക; സ്വന്തവിവേകത്തിൽ ഊന്നരുതു. നിന്റെ എല്ലാവഴികളിലും അവനെ നിനെച്ചുകൊൾക; അവൻ നിന്റെ പാതകളെ നേരെയാക്കും."],
  ["ജോഷ്വ 1:9","ഉറപ്പും ധൈര്യവും ഉള്ളവനായിരിക്ക എന്നു ഞാൻ നിന്നോടു കല്പിച്ചിട്ടില്ലയോ? ഭയപ്പെടരുതു, ഭ്രമിക്കരുതു; നീ പോകുന്നേടത്തൊക്കെയും നിന്റെ ദൈവമായ യഹോവ നിന്നോടുകൂടെ ഉണ്ടു."],
  ["റോമാ 8:28","എന്നാൽ ദൈവത്തെ സ്നേഹിക്കുന്നവർക്കു, നിർണ്ണയപ്രകാരം വിളിക്കപ്പെട്ടവർക്കു തന്നേ, സകലവും നന്മെക്കായി കൂടി വ്യാപരിക്കുന്നു എന്നു നാം അറിയുന്നു."],
  ["മത്തായി 11:28","അദ്ധ്വാനിക്കുന്നവരും ഭാരം ചുമക്കുന്നവരുമായുള്ളോരേ, എല്ലാവരും എന്റെ അടുക്കൽ വരുവിൻ; ഞാൻ നിങ്ങളെ ആശ്വസിപ്പിക്കും."],
  ["സങ്കീർത്തനങ്ങൾ 46:1","ദൈവം നമ്മുടെ സങ്കേതവും ബലവും ആകുന്നു; കഷ്ടങ്ങളിൽ അവൻ ഏറ്റവും അടുത്ത തുണയായിരിക്കുന്നു."],
  ["ഏശയ്യാ 40:31","എങ്കിലും യഹോവയെ കാത്തിരിക്കുന്നവർ ശക്തിയെ പുതുക്കും; അവർ കഴുകന്മാരെപ്പോലെ ചിറകടിച്ചു കയറും; അവർ തളർന്നുപോകാതെ ഓടുകയും ക്ഷീണിച്ചുപോകാതെ നടക്കയും ചെയ്യും."],
  ["യോഹന്നാൻ 14:27","സമാധാനം ഞാൻ നിങ്ങൾക്കു തന്നേച്ചുപോകുന്നു; എന്റെ സമാധാനം ഞാൻ നിങ്ങൾക്കു തരുന്നു; ലോകം തരുന്നതുപോലെ അല്ല ഞാൻ നിങ്ങൾക്കു തരുന്നതു; നിങ്ങളുടെ ഹൃദയം കലങ്ങരുതു, ഭ്രമിക്കയും അരുതു."],
  ["വിലാപങ്ങൾ 3:22-23","നാം നശിച്ചുപോകാതിരിക്കുന്നതു യഹോവയുടെ ദയ ആകുന്നു; അവന്റെ കരുണ തീർന്നുപോയിട്ടില്ലല്ലോ. അതു രാവിലെതോറും പുതിയതാകുന്നു; നിന്റെ വിശ്വസ്തത വലിയതു തന്നേ."],
  ["ഫിലിപ്പി 4:6","ഒന്നിനെക്കുറിച്ചും വിചാരപ്പെടരുതു; എല്ലാറ്റിലും പ്രാർത്ഥനയാലും അപേക്ഷയാലും നിങ്ങളുടെ ആവശ്യങ്ങൾ സ്തോത്രത്തോടുകൂടെ ദൈവത്തോടു അറിയിക്കയത്രേ വേണ്ടതു."],
  ["സങ്കീർത്തനങ്ങൾ 37:5","നിന്റെ വഴി യഹോവയെ ഭരമേല്പിക്ക; അവനിൽ തന്നേ ആശ്രയിക്ക; അവൻ അതു നിർവ്വഹിക്കും."],
  ["സങ്കീർത്തനങ്ങൾ 121:8","യഹോവ നിന്റെ ഗമനത്തെയും ആഗമനത്തെയും ഇന്നുമുതൽ എന്നേക്കും പരിപാലിക്കും."],
  ["നിയമാവർത്തനം 31:8","യഹോവ തന്നേ നിനക്കു മുമ്പായി നടക്കുന്നു; അവൻ നിന്നോടുകൂടെ ഇരിക്കും; നിന്നെ കൈവിടുകയില്ല, ഉപേക്ഷിക്കയുമില്ല; നീ ഭയപ്പെടരുതു, ഭ്രമിക്കരുതു."],
  ["സങ്കീർത്തനങ്ങൾ 32:8","ഞാൻ നിന്നെ ഉപദേശിച്ചു നീ നടക്കേണ്ടുന്ന വഴി നിനക്കു കാണിച്ചുതരും; ഞാൻ നിന്റെമേൽ ദൃഷ്ടിവെച്ചു നിനക്കു ആലോചന പറഞ്ഞുതരും."],
  ["മത്തായി 6:33","മുമ്പെ അവന്റെ രാജ്യവും നീതിയും അന്വേഷിപ്പിൻ; അതോടുകൂടെ ഇതൊക്കെയും നിങ്ങൾക്കു കിട്ടും."],
  ["2 കോറിന്തോസ് 12:9","എന്റെ കൃപ നിനക്കു മതി; എന്റെ ശക്തി ബലഹീനതയിൽ തികഞ്ഞുവരുന്നു."],
  ["സങ്കീർത്തനങ്ങൾ 91:11","നിന്റെ എല്ലാവഴികളിലും നിന്നെ കാക്കേണ്ടതിന്നു അവൻ നിന്നെക്കുറിച്ചു തന്റെ ദൂതന്മാരോടു കല്പിക്കും."],
  ["ഏശയ്യാ 26:3","സ്ഥിരമാനസൻ നിന്നിൽ ആശ്രയം വെച്ചിരിക്കയാൽ നീ അവനെ പൂർണ്ണസമാധാനത്തിൽ കാക്കുന്നു."],
  ["സംഖ്യ 6:24-26","യഹോവ നിന്നെ അനുഗ്രഹിച്ചു കാക്കുമാറാകട്ടെ; യഹോവ തിരുമുഖം നിന്റെമേൽ പ്രകാശിപ്പിച്ചു നിന്നോടു കൃപയുള്ളവനാകട്ടെ; യഹോവ തിരുമുഖം നിന്റെമേൽ ഉയർത്തി നിനക്കു സമാധാനം നല്കുമാറാകട്ടെ."],
  ["എബ്രായർ 13:5","ഞാൻ നിന്നെ ഒരുനാളും കൈവിടുകയില്ല, ഉപേക്ഷിക്കയുമില്ല."],
  ["1 പത്രോസ് 5:7","അവൻ നിങ്ങൾക്കായി കരുതുന്നതുകൊണ്ടു നിങ്ങളുടെ സകലചിന്താകുലവും അവന്റെമേൽ ഇട്ടുകൊൾവിൻ."],
  ["സങ്കീർത്തനങ്ങൾ 27:1","യഹോവ എന്റെ വെളിച്ചവും എന്റെ രക്ഷയും ആകുന്നു; ഞാൻ ആരെ ഭയപ്പെടും? യഹോവ എന്റെ ജീവന്റെ ബലം; ഞാൻ ആരെ പേടിക്കും?"],
  ["പുറപ്പാട് 14:14","യഹോവ നിങ്ങൾക്കു വേണ്ടി യുദ്ധം ചെയ്യും; നിങ്ങൾ മിണ്ടാതിരിക്കേണം."],
  ["യോഹന്നാൻ 16:33","ലോകത്തിൽ നിങ്ങൾക്കു കഷ്ടം ഉണ്ടു; എങ്കിലും ധൈര്യപ്പെടുവിൻ; ഞാൻ ലോകത്തെ ജയിച്ചിരിക്കുന്നു."],
  ["സങ്കീർത്തനങ്ങൾ 55:22","നിന്റെ ഭാരം യഹോവയുടെമേൽ വെച്ചുകൊൾക; അവൻ നിന്നെ പുലർത്തും; നീതിമാൻ കുലുങ്ങിപ്പോകുവാൻ അവൻ ഒരുനാളും സമ്മതിക്കയില്ല."],
  ["സങ്കീർത്തനങ്ങൾ 118:24","ഇതു യഹോവ ഉണ്ടാക്കിയ ദിവസം; ഇന്നു നാം ഘോഷിച്ചുല്ലസിക്ക."],
  ["ഏശയ്യാ 60:1","എഴുന്നേറ്റു പ്രകാശിക്ക; നിന്റെ പ്രകാശം വന്നിരിക്കുന്നു; യഹോവയുടെ മഹത്വവും നിന്റെമേൽ ഉദിച്ചിരിക്കുന്നു."],
  ["സങ്കീർത്തനങ്ങൾ 30:5","സന്ധ്യയിങ്കൽ കരച്ചിൽ വന്നു രാപാർക്കും; ഉഷസ്സിലോ ആനന്ദഘോഷം വരുന്നു."],
  ["മത്തായി 28:20","ഞാനോ ലോകാവസാനത്തോളം എല്ലാനാളും നിങ്ങളോടുകൂടെ ഉണ്ടു."],
  ["ജറെമിയാ 33:3","എന്നോടു വിളിച്ചപേക്ഷിക്ക; ഞാൻ നിനക്കു ഉത്തരം അരുളും; നീ അറിയാത്ത വലിയതും ദുർഗ്രഹവുമായ കാര്യങ്ങൾ ഞാൻ നിന്നെ അറിയിക്കും."],
  ["ഏശയ്യാ 43:19","ഇതാ, ഞാൻ പുതിയതൊന്നു ചെയ്യുന്നു; ഇപ്പോൾ തന്നേ അതു മുളെച്ചുവരും; നിങ്ങൾ അതു അറിയുന്നില്ലയോ?"],
  ["മർക്കോസ് 9:23","വിശ്വസിക്കുന്നവന്നു സകലവും കഴിയും."],
  ["സങ്കീർത്തനങ്ങൾ 103:2","എൻ മനമേ, യഹോവയെ വാഴ്ത്തുക; അവന്റെ ഉപകാരങ്ങൾ ഒന്നും മറക്കരുതു."],
  ["ഗലാത്തിയാ 6:9","നന്മ ചെയ്കയിൽ നാം മടുത്തുപോകരുതു; തളർന്നുപോകാഞ്ഞാൽ തക്കസമയത്തു നാം കൊയ്യും."]
];

const box=document.getElementById('box'), slip=document.getElementById('slip'),
      main=document.getElementById('main'), copyBtn=document.getElementById('copy'),
      status=document.getElementById('status');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let state='idle', timer=null, idx=Math.floor(Math.random()*VERSES.length), current=null;

function show(i, cls){
  const [ref,text]=VERSES[i];
  slip.innerHTML='<p class="verse"></p><p class="ref"></p>';
  slip.querySelector('.verse').textContent='“'+text+'”';
  slip.querySelector('.ref').textContent='— '+ref;
  slip.classList.remove('flip','slow','land'); void slip.offsetWidth;
  if(cls && !reduce) slip.classList.add(cls);
}
function nextIdx(){ let n; do{ n=Math.floor(Math.random()*VERSES.length);}while(n===idx); return idx=n; }
function slot(){return slip.parentElement}

function start(){
  state='spinning'; copyBtn.hidden=true;
  slot().classList.add('rolling');
  main.textContent='നിർത്തുക'; status.textContent='വചനങ്ങൾ മറിയുന്നു… നിർത്താൻ വീണ്ടും തൊടുക';
  (function tick(){ show(nextIdx(),'flip'); timer=setTimeout(tick,130); })();
}
function stop(){
  state='stopping'; clearTimeout(timer);
  main.disabled=true; status.textContent='നിൽക്കുന്നു…';
  let delay=150;
  (function slowTick(){
    if(delay>520) return finish();
    show(nextIdx(), delay>300?'slow':'flip');
    delay*=1.28;
    timer=setTimeout(slowTick,delay);
  })();
}
function finish(){
  state='done'; current=VERSES[idx];
  slot().classList.remove('rolling');
  show(idx,'land');
  main.disabled=false; main.textContent='വീണ്ടും എടുക്കുക';
  copyBtn.hidden=false; copyBtn.textContent='പകർത്തുക';
  status.textContent='ഇന്നത്തെ നിങ്ങളുടെ വചനം';
}
function toggle(){
  if(state==='idle'||state==='done') start();
  else if(state==='spinning') stop();
}
box.addEventListener('click',toggle);
main.addEventListener('click',toggle);
copyBtn.addEventListener('click',()=>{
  if(!current) return;
  const t='“'+current[1]+'” — '+current[0];
  const done=()=>{copyBtn.textContent='പകർത്തി ✓'};
  function selectFallback(){
    const r=document.createRange(); r.selectNodeContents(slip);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    copyBtn.textContent='തിരഞ്ഞെടുത്തു — കോപ്പി ചെയ്യുക';
  }
  try{ navigator.clipboard.writeText(t).then(done).catch(selectFallback); }
  catch(e){ selectFallback(); }
});
</script>
</body>
</html>
